services:
  node1:
    build: .
    container_name: toobix-node-1
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: 8000
      DB_PATH: /data/node1.db
      TOOBIX_API_TOKEN: ${TOOBIX_API_TOKEN:?Set TOOBIX_API_TOKEN before starting}
      TOOBIX_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TOOBIX_ALLOW_PRIVATE_PEERS: "1"
    volumes:
      - node1-data:/data
    restart: unless-stopped

  node2:
    build: .
    container_name: toobix-node-2
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PORT: 8000
      DB_PATH: /data/node2.db
      TOOBIX_API_TOKEN: ${TOOBIX_API_TOKEN:?Set TOOBIX_API_TOKEN before starting}
      TOOBIX_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TOOBIX_ALLOW_PRIVATE_PEERS: "1"
    volumes:
      - node2-data:/data
    restart: unless-stopped

  node3:
    build: .
    container_name: toobix-node-3
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      PORT: 8000
      DB_PATH: /data/node3.db
      TOOBIX_API_TOKEN: ${TOOBIX_API_TOKEN:?Set TOOBIX_API_TOKEN before starting}
      TOOBIX_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TOOBIX_ALLOW_PRIVATE_PEERS: "1"
    volumes:
      - node3-data:/data
    restart: unless-stopped

volumes:
  node1-data:
  node2-data:
  node3-data:
