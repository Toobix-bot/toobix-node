name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run backend tests
        run: python -m pytest -q test_backend.py
      - name: Run pipeline verification
        run: python test_pipeline.py

  p2p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local two-node test
        run: bash test_p2p.sh

  frontend-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Reject generated Python bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Generated Python bytecode must not be committed."
            exit 1
          fi
      - name: Reject external font dependency
        run: |
          if grep -R "fonts.googleapis.com" -- index.html style.css app.js; then
            echo "External Google Fonts dependency found."
            exit 1
          fi
      - name: Require project policy files
        run: test -f LICENSE && test -f PRIVACY.md && test -f SECURITY.md
